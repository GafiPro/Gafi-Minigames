name: Build Gafi Minigames

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build
        run: gradle clean build --no-daemon --max-workers=1

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: gafi-minigames
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 3
